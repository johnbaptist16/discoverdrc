# Render Blueprint — creates the database and the web service in one go.
# Render dashboard → New → Blueprint → pick this repo → Apply.
databases:
  - name: discoverdrc-db
    plan: free
    databaseName: discoverdrc
    user: discoverdrc

services:
  - type: web
    name: discoverdrc
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: discoverdrc-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: ADMIN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
